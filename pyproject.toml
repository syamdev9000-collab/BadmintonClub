[project]
name = "badminton-club-manager"
version = "0.1.0"
description = "A badminton club management & payments API built with FastAPI."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "pydantic[email]>=2.14.2",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "alembic>=1.14.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["userhub*"]
